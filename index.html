<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Girlfriend's Day ❤️</title>
</head>
<body>
    <div id="loading" style="position:fixed;inset:0;background:#0d0309;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;color:#d4af37;">
        <div style="width:50px;height:50px;border:3px solid #d4af37;border-top:3px solid transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="margin-top:20px;font-size:1.2rem;letter-spacing:2px;">✨ Loading... ✨</p>
        <style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
    </div>
    <div id="app"></div>
    <script>
        (function() {
            "use strict";

            // ============================================================
            // 🔥 NEW: URL SHARE SYSTEM - PC se Phone tak photos
            // ============================================================
            
            // Save photos with a special code
            function savePhotosWithCode(photosArray) {
                try {
                    if (!photosArray || !Array.isArray(photosArray)) return false;
                    
                    const data = { 
                        photos: photosArray, 
                        uploaded: true, 
                        timestamp: Date.now() 
                    };
                    
                    localStorage.setItem('gf_photos_share', JSON.stringify(data));
                    
                    // Generate share code
                    const shareCode = btoa(JSON.stringify({
                        photos: photosArray.slice(0, 20), // Max 20 photos for sharing
                        version: '1.0'
                    }));
                    
                    // Save share code in URL
                    const currentUrl = window.location.href.split('?')[0];
                    const shareUrl = currentUrl + '?share=' + encodeURIComponent(shareCode);
                    
                    return { success: true, shareUrl: shareUrl, count: photosArray.length };
                } catch(e) {
                    console.error('Save error:', e);
                    return { success: false, error: e.message };
                }
            }

            // Load photos from URL share code
            function loadPhotosFromShare() {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const shareCode = urlParams.get('share');
                    
                    if (!shareCode) return null;
                    
                    const decoded = JSON.parse(atob(decodeURIComponent(shareCode)));
                    if (decoded && decoded.photos && decoded.photos.length > 0) {
                        console.log('📸 Loaded from share:', decoded.photos.length, 'photos');
                        // Save to local storage
                        localStorage.setItem('gf_photos_share', JSON.stringify({ 
                            photos: decoded.photos, 
                            uploaded: true, 
                            timestamp: Date.now() 
                        }));
                        return decoded.photos;
                    }
                    return null;
                } catch(e) {
                    console.error('Share load error:', e);
                    return null;
                }
            }

            // Regular load
            function loadPhotosFromStorage() {
                try {
                    const raw = localStorage.getItem('gf_photos_share');
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed.photos)) return null;
                    return parsed.photos;
                } catch(e) {
                    return null;
                }
            }

            // ============================================================
            // SIMPLE VERSION - BUILD APP
            // ============================================================
            
            function buildApp() {
                const app = document.getElementById('app');
                
                app.innerHTML = `
                    <style>
                        *{margin:0;padding:0;box-sizing:border-box}
                        body{font-family:'Georgia',serif;background:#0d0309;min-height:100vh;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent}
                        
                        #intro{position:fixed;inset:0;background:radial-gradient(circle at center,#1a0813,#0d0309);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:20px;transition:opacity 1s}
                        #intro.hidden{opacity:0;pointer-events:none}
                        
                        .title{font-size:clamp(2rem,5vw,3.5rem);color:#d4af37;text-align:center;margin-bottom:20px;text-shadow:0 0 30px rgba(212,175,55,0.4)}
                        .subtitle{color:#ffb3c6;font-size:clamp(0.9rem,2vw,1.2rem);text-align:center;margin-bottom:30px;font-style:italic}
                        
                        .btn{border:1px solid #d4af37;background:transparent;color:#d4af37;padding:14px 28px;border-radius:30px;font-size:1rem;cursor:pointer;transition:all 0.3s;font-family:'Georgia',serif;margin:8px}
                        .btn:hover{background:rgba(212,175,55,0.2);transform:scale(1.05)}
                        .btn-gold{background:linear-gradient(45deg,#d4af37,#f7d070);color:#1a0813;border:none}
                        .btn-gold:hover{background:linear-gradient(45deg,#f7d070,#d4af37)}
                        
                        #main{min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1s}
                        #main.visible{opacity:1}
                        
                        .card{background:rgba(15,5,12,0.8);backdrop-filter:blur(15px);border:1px solid rgba(212,175,55,0.3);border-radius:20px;padding:30px 25px;max-width:500px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.8)}
                        .card-title{color:#d4af37;font-size:1.8rem;margin-bottom:10px}
                        .card-sub{color:#e0b0c0;font-size:0.9rem;margin-bottom:20px;font-style:italic}
                        
                        .upload-area{border:2px dashed rgba(212,175,55,0.4);border-radius:15px;padding:30px 20px;margin:15px 0;cursor:pointer;transition:all 0.3s}
                        .upload-area:hover{border-color:#d4af37;background:rgba(212,175,55,0.05)}
                        .upload-area input{display:none}
                        
                        .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin:15px 0;max-height:300px;overflow-y:auto}
                        .photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(212,175,55,0.3)}
                        
                        .status{color:#f7d070;font-size:0.85rem;margin:10px 0}
                        .count-badge{background:rgba(212,175,55,0.2);padding:5px 15px;border-radius:20px;display:inline-block;margin:5px 0}
                        
                        .hidden{display:none !important}
                        
                        #share-link-area{background:rgba(0,0,0,0.5);border-radius:10px;padding:15px;margin:15px 0;word-break:break-all;font-size:0.8rem;color:#d4af37;border:1px solid rgba(212,175,55,0.2)}
                        #share-link-area input{width:100%;background:transparent;border:none;color:#fff;padding:5px;font-size:0.8rem}
                        
                        #romantic-card{display:none;margin-top:20px}
                        #romantic-card.visible{display:block}
                        .romantic-text{font-family:'Georgia',serif;font-size:1.1rem;line-height:1.8;color:#f3e5ab;font-style:italic;padding:20px 0}
                        
                        @media(max-width:480px){.card{padding:20px 15px}.card-title{font-size:1.4rem}.photo-grid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr)}}
                    </style>
                    
                    <div id="intro">
                        <h1 class="title">💖 Happy Girlfriend's Day</h1>
                        <p class="subtitle">"For my beloved, with all my heart"</p>
                        <button class="btn btn-gold" id="enterBtn">✨ Enter The Experience ✨</button>
                    </div>
                    
                    <div id="main">
                        <div class="card">
                            <div class="card-title">💖 Memories Gallery</div>
                            <div class="card-sub">Upload your beautiful photos & share with your love</div>
                            
                            <div id="uploadSection">
                                <div class="upload-area" id="uploadArea">
                                    <div style="font-size:2.5rem;margin-bottom:10px;">📸</div>
                                    <div style="color:#d4af37;font-size:0.9rem;">Tap to select photos (Max 20)</div>
                                    <input type="file" id="photoInput" multiple accept="image/*">
                                </div>
                                
                                <div class="upload-area" id="songArea" style="margin-top:10px;">
                                    <div style="font-size:2rem;margin-bottom:10px;">🎵</div>
                                    <div style="color:#d4af37;font-size:0.9rem;">Tap to upload MP3 song (Max 5MB)</div>
                                    <input type="file" id="songInput" accept="audio/mp3,audio/mpeg,audio/*">
                                </div>
                            </div>
                            
                            <div id="photoGrid" class="photo-grid"></div>
                            
                            <div class="status" id="statusMsg">📸 No photos uploaded yet</div>
                            <div class="count-badge" id="countBadge">0 photos</div>
                            
                            <div id="actionButtons">
                                <button class="btn btn-gold" id="explodeBtn" style="display:none;">🎆 Explode Memories</button>
                                <button class="btn" id="shareBtn" style="display:none;">🔗 Generate Share Link</button>
                            </div>
                            
                            <div id="share-link-area" style="display:none;">
                                <label style="color:#ffb3c6;font-size:0.8rem;">📋 Copy this link and send to your phone:</label>
                                <input type="text" id="shareLinkInput" readonly style="color:#d4af37;">
                                <button class="btn" id="copyBtn" style="padding:8px 16px;font-size:0.8rem;margin-top:5px;">📋 Copy Link</button>
                            </div>
                            
                            <div id="romantic-card">
                                <div class="romantic-text">"In a universe full of fading stars, your smile remains my brightest light.<br><br>You are my softest thought, my favorite reality, and the forever I always dreamed of."</div>
                                <button class="btn btn-gold" id="endBtn">💕 The End</button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="finalScreen" style="position:fixed;inset:0;background:#040105;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:20px;text-align:center;">
                        <div style="font-size:clamp(2.5rem,6vw,4rem);color:#ffb3c6;text-shadow:0 0 30px rgba(255,77,109,0.8);line-height:1.4;">I love you my baby, keep loving me</div>
                        <div style="font-family:'Georgia',serif;font-size:1.5rem;color:#d4af37;margin-top:20px;font-style:italic;">~ junaid</div>
                    </div>
                    
                    <audio id="bgMusic" loop></audio>
                `;

                // ============================================================
                // APP LOGIC
                // ============================================================
                
                setTimeout(function() {
                    document.getElementById('loading').style.display = 'none';
                }, 500);

                let photos = [];
                let songData = null;
                let shareUrl = '';

                // Load photos from storage or share
                function loadAllPhotos() {
                    // First check URL share
                    const shared = loadPhotosFromShare();
                    if (shared && shared.length > 0) {
                        photos = shared;
                        updateUI();
                        return true;
                    }
                    
                    // Then check local storage
                    const stored = loadPhotosFromStorage();
                    if (stored && stored.length > 0) {
                        photos = stored;
                        updateUI();
                        return true;
                    }
                    
                    return false;
                }

                // Update UI
                function updateUI() {
                    const grid = document.getElementById('photoGrid');
                    const status = document.getElementById('statusMsg');
                    const count = document.getElementById('countBadge');
                    const explodeBtn = document.getElementById('explodeBtn');
                    const shareBtn = document.getElementById('shareBtn');
                    
                    grid.innerHTML = '';
                    
                    if (photos.length > 0) {
                        photos.slice(0, 20).forEach(url => {
                            const img = document.createElement('img');
                            img.src = url;
                            grid.appendChild(img);
                        });
                        
                        status.textContent = '✅ ' + photos.length + ' photos loaded!';
                        count.textContent = photos.length + ' photos';
                        explodeBtn.style.display = 'inline-block';
                        shareBtn.style.display = 'inline-block';
                    } else {
                        status.textContent = '📸 No photos uploaded yet';
                        count.textContent = '0 photos';
                        explodeBtn.style.display = 'none';
                        shareBtn.style.display = 'none';
                    }
                }

                // Compress image
                function compressImage(file, maxWidth = 250, maxHeight = 250, quality = 0.4) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = new Image();
                            img.onload = function() {
                                const canvas = document.createElement('canvas');
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; } }
                                else { if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; } }
                                canvas.width = w; canvas.height = h;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, w, h);
                                resolve(canvas.toDataURL('image/jpeg', quality));
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }

                // PHOTO UPLOAD
                document.getElementById('photoInput').addEventListener('change', async function(e) {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    
                    if (files.length > 20) {
                        alert('⚠️ Maximum 20 photos allowed for sharing');
                        this.value = '';
                        return;
                    }
                    
                    const newPhotos = [];
                    for (let f of files) {
                        try {
                            const compressed = await compressImage(f, 250, 250, 0.4);
                            newPhotos.push(compressed);
                        } catch(err) {
                            console.error('Error compressing:', err);
                        }
                    }
                    
                    if (newPhotos.length === 0) {
                        alert('❌ Failed to process photos');
                        return;
                    }
                    
                    photos = photos.concat(newPhotos);
                    updateUI();
                    
                    // Save to storage
                    localStorage.setItem('gf_photos_share', JSON.stringify({ 
                        photos: photos, 
                        uploaded: true, 
                        timestamp: Date.now() 
                    }));
                    
                    document.getElementById('statusMsg').textContent = '✅ ' + photos.length + ' photos saved!';
                    alert('✅ ' + photos.length + ' photos saved!\n\nNow click "Generate Share Link" to send to phone.');
                });

                // SONG UPLOAD
                document.getElementById('songInput').addEventListener('change', async function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    if (file.size > 5 * 1024 * 1024) {
                        alert('❌ File too large! Max 5MB.');
                        this.value = '';
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        songData = e.target.result;
                        localStorage.setItem('gf_song_share', songData);
                        document.getElementById('statusMsg').textContent = '🎵 Song loaded: ' + file.name;
                        alert('✅ Song uploaded!');
                        
                        // Set audio
                        const audio = document.getElementById('bgMusic');
                        audio.src = songData;
                        audio.load();
                    };
                    reader.readAsDataURL(file);
                });

                // GENERATE SHARE LINK
                document.getElementById('shareBtn').addEventListener('click', function() {
                    if (photos.length === 0) {
                        alert('Please upload photos first!');
                        return;
                    }
                    
                    const result = savePhotosWithCode(photos);
                    if (result.success) {
                        shareUrl = result.shareUrl;
                        document.getElementById('shareLinkInput').value = shareUrl;
                        document.getElementById('share-link-area').style.display = 'block';
                        document.getElementById('statusMsg').textContent = '✅ Share link generated! Copy it to send to phone.';
                    } else {
                        alert('❌ Error generating link: ' + result.error);
                    }
                });

                // COPY LINK
                document.getElementById('copyBtn').addEventListener('click', function() {
                    const input = document.getElementById('shareLinkInput');
                    input.select();
                    navigator.clipboard.writeText(input.value).then(function() {
                        alert('✅ Link copied!\n\nSend this link to your phone via WhatsApp or email.');
                    }).catch(function() {
                        input.select();
                        document.execCommand('copy');
                        alert('✅ Link copied!');
                    });
                });

                // EXPLODE MEMORIES
                document.getElementById('explodeBtn').addEventListener('click', function() {
                    if (photos.length === 0) {
                        alert('Please upload photos first!');
                        return;
                    }
                    
                    const container = document.getElementById('main');
                    const card = document.querySelector('.card');
                    const romanticCard = document.getElementById('romantic-card');
                    
                    // Create explosion
                    const explosionDiv = document.createElement('div');
                    explosionDiv.style.cssText = 'position:fixed;inset:0;z-index:8000;overflow:hidden;pointer-events:none;background:radial-gradient(circle at center,#150510 0%,#050106 100%);';
                    document.body.appendChild(explosionDiv);
                    
                    const total = Math.max(30, photos.length * 5);
                    for (let i = 0; i < total; i++) {
                        setTimeout(() => {
                            const cardEl = document.createElement('div');
                            cardEl.style.cssText = `
                                position:absolute;width:${120 + Math.random() * 80}px;
                                background:#120a10;padding:6px 6px 15px 6px;
                                border-radius:6px;border:1px solid rgba(212,175,55,0.4);
                                box-shadow:0 10px 30px rgba(0,0,0,0.9);
                                pointer-events:none;opacity:0;
                                left:50%;top:50%;
                                transition:all 4s cubic-bezier(0.15,0.85,0.35,1);
                                transform:translate(-50%,-50%) scale(0.1) rotate(0deg);
                            `;
                            const img = document.createElement('img');
                            img.src = photos[i % photos.length];
                            img.style.cssText = 'width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;';
                            cardEl.appendChild(img);
                            explosionDiv.appendChild(cardEl);
                            
                            requestAnimationFrame(() => {
                                const tx = (Math.random() - 0.5) * window.innerWidth * 1.6;
                                const ty = (Math.random() - 0.5) * window.innerHeight * 1.6;
                                const rot = (Math.random() - 0.5) * 360;
                                const scale = 0.5 + Math.random() * 0.8;
                                cardEl.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale}) rotate(${rot}deg)`;
                                cardEl.style.opacity = '1';
                            });
                        }, i * 70);
                    }
                    
                    setTimeout(() => {
                        const glow = document.createElement('div');
                        glow.style.cssText = 'position:fixed;inset:0;z-index:8500;background:radial-gradient(circle at center,#fff,#f7d070,#0d0309);opacity:0;transition:opacity 1.8s;pointer-events:none;';
                        document.body.appendChild(glow);
                        requestAnimationFrame(() => { glow.style.opacity = '1'; });
                        
                        setTimeout(() => {
                            glow.style.opacity = '0';
                            setTimeout(() => {
                                glow.remove();
                                explosionDiv.remove();
                                romanticCard.classList.add('visible');
                                card.style.opacity = '0.3';
                            }, 1800);
                        }, 1800);
                    }, total * 70 + 1000);
                });

                // THE END
                document.getElementById('endBtn').addEventListener('click', function() {
                    document.getElementById('main').style.display = 'none';
                    document.getElementById('finalScreen').style.display = 'flex';
                });

                // ENTER BUTTON
                document.getElementById('enterBtn').addEventListener('click', function() {
                    document.getElementById('intro').classList.add('hidden');
                    document.getElementById('main').classList.add('visible');
                    
                    // Try to load song
                    const savedSong = localStorage.getItem('gf_song_share');
                    if (savedSong) {
                        songData = savedSong;
                        const audio = document.getElementById('bgMusic');
                        audio.src = savedSong;
                        audio.load();
                        document.getElementById('statusMsg').textContent = '🎵 Song loaded!';
                    }
                });

                // VINYL PLAYER (tap anywhere to play)
                document.addEventListener('click', function(e) {
                    if (e.target.closest('#main') || e.target.closest('.card')) {
                        const audio = document.getElementById('bgMusic');
                        if (audio.src && audio.paused) {
                            audio.volume = 0.5;
                            audio.play().catch(() => {});
                        }
                    }
                });

                // Load everything
                loadAllPhotos();

                console.log('💖 App Loaded!');
                console.log('📸 Photos:', photos.length);
                console.log('💾 Storage:', localStorage.getItem('gf_photos_share') ? 'Yes' : 'No');
            }

            // ============================================================
            // START
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', buildApp);
            } else {
                buildApp();
            }

        })();
    </script>
</body>
</html>
