    <script>
        (function() {
            "use strict";

            // ============================================================
            // 1. PERMANENT STORAGE - localStorage with Base64
            // ============================================================
            const STORAGE_KEY = 'gf_photos_permanent_v4';
            const SONG_KEY = 'gf_song_permanent';
            const isViewerMode = window.location.search.includes('viewerMode=true');

            // Save photos to localStorage
            function savePhotos(photosArray) {
                try {
                    const data = {
                        photos: photosArray,
                        uploaded: true,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    console.log('✅ Saved:', photosArray.length, 'photos');
                    return true;
                } catch(e) {
                    console.error('Save error:', e);
                    return false;
                }
            }

            // Load photos from localStorage
            function loadPhotos() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        console.log('📭 No photos found');
                        return { photos: [], uploaded: false };
                    }
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed.photos)) parsed.photos = [];
                    console.log('📸 Loaded:', parsed.photos.length, 'photos');
                    return parsed;
                } catch(e) {
                    console.error('Load error:', e);
                    return { photos: [], uploaded: false };
                }
            }

            // Save song to localStorage
            function saveSong(songData) {
                try {
                    if (!songData) {
                        localStorage.removeItem(SONG_KEY);
                        return true;
                    }
                    localStorage.setItem(SONG_KEY, songData);
                    console.log('🎵 Song saved');
                    return true;
                } catch(e) {
                    console.error('Song save error:', e);
                    return false;
                }
            }

            // Load song from localStorage
            function loadSong() {
                try {
                    const raw = localStorage.getItem(SONG_KEY);
                    if (!raw) return null;
                    console.log('🎵 Song loaded');
                    return raw;
                } catch(e) {
                    console.error('Song load error:', e);
                    return null;
                }
            }

            // Check if photos exist
            function hasPhotos() {
                const data = loadPhotos();
                return data.photos && data.photos.length > 0;
            }

            // File to Base64 with compression
            function fileToBase64(file) {
                return new Promise(function(resolve, reject) {
                    const reader = new FileReader();
                    reader.onload = function(e) { resolve(e.target.result); };
                    reader.onerror = function(e) { reject(e); };
                    reader.readAsDataURL(file);
                });
            }

            // Compress image before saving
            function compressImage(file, maxWidth = 500, maxHeight = 500, quality = 0.6) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > height) {
                                if (width > maxWidth) {
                                    height *= maxWidth / width;
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width *= maxHeight / height;
                                    height = maxHeight;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            // ============================================================
            // 2. Load Three.js
            // ============================================================
            function loadThreeJS() {
                return new Promise(function(resolve, reject) {
                    if (typeof THREE !== 'undefined') { resolve(); return; }
                    const sources = [
                        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                        'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
                    ];
                    let idx = 0;
                    function tryNext() {
                        if (idx >= sources.length) { reject(new Error('Failed')); return; }
                        const script = document.createElement('script');
                        script.src = sources[idx];
                        script.onload = function() {
                            if (typeof THREE !== 'undefined') resolve();
                            else { idx++; tryNext(); }
                        };
                        script.onerror = function() { idx++; tryNext(); };
                        document.head.appendChild(script);
                    }
                    tryNext();
                });
            }

                    // ============================================================

                    const promises = [

                    document.getElementById('sky-layer').addEventListener('click', function(event) {

                    // ============================================================
                    // ORBIT MECHANIC
                    // ============================================================
                    let isFused = false;

                    function initOrbitMechanic() {
                        const pHis = document.getElementById('planet-his');
                        const pHers = document.getElementById('planet-hers');
                        const badge = document.getElementById('distance-badge');
                        const orbitTitle = document.getElementById('orbit-title');
                        const flashOverlay = document.getElementById('white-glow-flash');

                        function makeDraggable(element) {
                            let isDragging = false;
                            let offsetX = 0, offsetY = 0;

                            element.addEventListener('pointerdown', function(e) {
                                if (isFused) return;
                                isDragging = true;
                                element.setPointerCapture(e.pointerId);
                                const rect = element.getBoundingClientRect();
                                offsetX = e.clientX - rect.left - rect.width / 2;
                                offsetY = e.clientY - rect.top - rect.height / 2;
                            });

                            element.addEventListener('pointermove', function(e) {
                                if (!isDragging || isFused) return;
                                const parentRect = document.getElementById('space-canvas').getBoundingClientRect();
                                let x = e.clientX - parentRect.left - offsetX;
                                let y = e.clientY - parentRect.top - offsetY;

                                element.style.left = x + 'px';
                                element.style.top = y + 'px';

                                checkDistance();
                            });

                            element.addEventListener('pointerup', function() { isDragging = false; });
                        }

                        makeDraggable(pHis);
                        makeDraggable(pHers);

                        function checkDistance() {
                            const r1 = pHis.getBoundingClientRect();
                            const r2 = pHers.getBoundingClientRect();
                            const dist = Math.hypot(
                                (r2.left + r2.width / 2) - (r1.left + r1.width / 2),
                                (r2.top + r2.height / 2) - (r1.top + r1.height / 2)
                            );
                            const kmDistance = Math.max(0, Math.round(dist - 110));

                            badge.textContent = 'Distance: ' + kmDistance + ' km';
                            if (kmDistance <= 15 && !isFused) triggerFusion();
                        }

                        function triggerFusion() {
                            isFused = true;
                            pHis.style.transition = 'all 0.6s ease';
                            pHers.style.transition = 'all 0.6s ease';
                            pHis.style.opacity = '0';
                            pHers.style.opacity = '0';
                            badge.style.opacity = '0';
                            orbitTitle.style.opacity = '0';
                            flashOverlay.classList.add('active');

                            for (let i = 0; i < 40; i++) {
                                (function(index) {
                                    setTimeout(function() {
                                        const petal = document.createElement('div');
                                        petal.className = 'petal';
                                        petal.style.left = (Math.random() * 100) + 'vw';
                                        document.body.appendChild(petal);
                                        setTimeout(function() { if (petal.parentNode) petal.remove(); }, 6000);
                                    }, index * 100);
                                })(i);
                            }

                            setTimeout(function() {
                                document.getElementById('royal-scroll-modal').classList.add('active');
                                setTimeout(function() { flashOverlay.classList.remove('active'); }, 800);
                            }, 1200);
                        }
                    }

                    // ============================================================
                    // ENTER SANCTUARY
                    // ============================================================
                    document.getElementById('enter-sanctuary-btn').addEventListener('click', function() {
                        document.getElementById('royal-scroll-modal').classList.remove('active');
                        document.getElementById('map-layer').style.opacity = '0';
                        setTimeout(function() {
                            document.getElementById('map-layer').style.visibility = 'hidden';
                            document.getElementById('sanctuary-layer').classList.add('active');
                            initCandleSanctuary();
                        }, 1200);
                    });

                    // ============================================================
                    // CANDLE SANCTUARY
                    // ============================================================
                    let openedCandleCount = 0;
                    let sanctuaryLit = false;
                    let centerFlame, centerLight, centerTaperMesh;
                    let floatingCandles = [];
                    let sanctuaryRaycaster, sanctuaryCamera;

                    function initCandleSanctuary() {
                        const container = document.getElementById('candle-webgl-container');
                        if (container.children.length > 0) return;

                        if (typeof THREE === 'undefined') {
                            container.innerHTML = `
                                <div style="display:flex;justify-content:center;align-items:center;height:100%;color:#d4af37;font-family:Georgia,serif;font-size:1.2rem;text-align:center;padding:20px;">
                                    <div>
                                        <p style="font-size:3rem;">🕯️</p>
                                        <p style="margin-top:10px;">Candle Sanctuary</p>
                                        <p style="font-size:0.9rem;color:#f7d070;margin-top:5px;">Tap the center to ignite magical candles</p>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        try {
                            const scene = new THREE.Scene();
                            scene.fog = new THREE.FogExp2(0x020104, 0.015);

                            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                            camera.position.set(0, 0, 10);

                            const renderer = new THREE.WebGLRenderer({ antialias: true });
                            renderer.setSize(window.innerWidth, window.innerHeight);
                            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                            container.appendChild(renderer.domElement);

                            const ambLight = new THREE.AmbientLight(0x221133, 0.6);
                            scene.add(ambLight);

                            const waxMat = new THREE.MeshStandardMaterial({ color: 0xfffae6, roughness: 0.5 });
                            const taperGeo = new THREE.CylinderGeometry(0.2, 0.25, 3, 32);
                            centerTaperMesh = new THREE.Mesh(taperGeo, waxMat);
                            centerTaperMesh.position.y = -0.3;
                            scene.add(centerTaperMesh);

                            const flameGeo = new THREE.ConeGeometry(0.12, 0.4, 16);
                            const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0 });
                            centerFlame = new THREE.Mesh(flameGeo, flameMat);
                            centerFlame.position.y = 1.45;
                            scene.add(centerFlame);

                            centerLight = new THREE.PointLight(0xffaa44, 0, 15);
                            centerLight.position.y = 1.5;
                            scene.add(centerLight);

                            const candleGeometry = new THREE.CylinderGeometry(0.14, 0.14, 0.55, 16);
                            const floatingCount = 180;

                            for (let i = 0; i < floatingCount; i++) {
                                const candleContainer = new THREE.Group();
                                const radius = 3.2 + Math.random() * 22;
                                const theta = Math.random() * Math.PI * 2;
                                const phi = (Math.random() - 0.5) * Math.PI * 0.85;

                                candleContainer.position.x = radius * Math.cos(theta) * Math.cos(phi);
                                candleContainer.position.y = radius * Math.sin(phi);
                                candleContainer.position.z = -1.5 - Math.random() * 25;

                                const body = new THREE.Mesh(candleGeometry, waxMat);
                                candleContainer.add(body);

                                const fGeo = new THREE.ConeGeometry(0.08, 0.25, 12);
                                const fMat = new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0 });
                                const flame = new THREE.Mesh(fGeo, fMat);
                                flame.position.y = 0.38;
                                candleContainer.add(flame);

                                const light = new THREE.PointLight(0xff8822, 0, 7);
                                light.position.y = 0.4;
                                candleContainer.add(light);

                                scene.add(candleContainer);

                                floatingCandles.push({
                                    group: candleContainer, flame: flame, light: light, body: body,
                                    baseY: candleContainer.position.y,
                                    baseX: candleContainer.position.x,
                                    floatSpeedY: 0.5 + Math.random() * 1.0,
                                    floatSpeedX: 0.3 + Math.random() * 0.7,
                                    floatSpeedRot: 0.2 + Math.random() * 0.5,
                                    floatOffset: Math.random() * Math.PI * 2,
                                    lit: false,
                                    igniteDelay: radius * 0.08 + Math.random() * 0.5
                                });
                            }

                            sanctuaryRaycaster = new THREE.Raycaster();
                            sanctuaryCamera = camera;

                            window.addEventListener('pointerdown', function(e) {
                                const sLayer = document.getElementById('sanctuary-layer');
                                if (!sLayer.classList.contains('active') || e.target.classList.contains('polaroid-layer-trigger')) return;

                                if (!sanctuaryLit) {
                                    sanctuaryLit = true;
                                    let op = 0;
                                    const interval = setInterval(function() {
                                        op += 0.05;
                                        if (centerFlame) {
                                            centerFlame.material.opacity = op;
                                            centerLight.intensity = op * 2.5;
                                        }
                                        if (op >= 1) {
                                            clearInterval(interval);
                                            document.getElementById('sanctuary-hint').innerText = "Tap any floating candle to reveal a secret note";
                                        }
                                    }, 30);
                                } else if (sanctuaryRaycaster && sanctuaryCamera) {
                                    const mouse = new THREE.Vector2();
                                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                                    sanctuaryRaycaster.setFromCamera(mouse, sanctuaryCamera);

                                    const objects = floatingCandles.map(function(c) { return c.body; });
                                    const intersects = sanctuaryRaycaster.intersectObjects(objects);
                                    if (intersects.length > 0) {
                                        const candle = floatingCandles.find(function(c) { return c.body === intersects[0].object; });
                                        if (candle && candle.lit) {
                                            openedCandleCount++;
                                            document.getElementById('secret-note-text').innerText = '"' + Array(openedCandleCount).fill("I love you").join(" ") + '"';
                                            document.getElementById('secret-note-modal').classList.add('active');
                                        }
                                    }
                                }
                            });

                            const clock = new THREE.Clock();

                            function animateSanctuary() {
                                requestAnimationFrame(animateSanctuary);
                                const elapsedTime = clock.getElapsedTime();

                                if (sanctuaryLit) centerLight.intensity = 2.2 + Math.sin(elapsedTime * 12) * 0.2;
                                if (centerTaperMesh) centerTaperMesh.position.y = -0.3 + Math.sin(elapsedTime * 0.8) * 0.15;
                                if (centerFlame) centerFlame.position.y = centerTaperMesh.position.y + 1.75;
                                if (centerLight) centerLight.position.y = centerTaperMesh.position.y + 1.8;

                                floatingCandles.forEach(function(c) {
                                    c.group.position.y = c.baseY + Math.sin(elapsedTime * c.floatSpeedY + c.floatOffset) * 0.45;
                                    c.group.position.x = c.baseX + Math.cos(elapsedTime * c.floatSpeedX + c.floatOffset) * 0.25;
                                    c.group.rotation.z = Math.sin(elapsedTime * c.floatSpeedRot + c.floatOffset) * 0.08;

                                    if (sanctuaryLit && !c.lit && elapsedTime > c.igniteDelay) c.lit = true;
                                    if (c.lit && c.flame.material.opacity < 1) {
                                        c.flame.material.opacity += 0.03;
                                        c.light.intensity = c.flame.material.opacity * 1.5;
                                    }
                                });

                                renderer.render(scene, camera);
                            }
                            animateSanctuary();
                        } catch (e) {
                            console.warn('Three.js error:', e);
                        }
                    }

                    // ============================================================
                    // CLOSE SECRET MODAL
                    // ============================================================
                    document.getElementById('close-secret-modal-btn').addEventListener('click', function() {
                        document.getElementById('secret-note-modal').classList.remove('active');

                    // ============================================================
                    // GO TO POLAROID
                    // ============================================================
                    document.getElementById('goto-polaroid-btn').addEventListener('click', function() {

                    // ============================================================
                    // POLAROID CAMERA
                    // ============================================================
                    const video = document.getElementById('webcam');
                    const canvas = document.getElementById('polaroid-canvas');
                    const polaroidResult = document.getElementById('polaroid-result');
                    const retakeBtn = document.getElementById('retake-btn');
                    const nextLayer7Btn = document.getElementById('next-layer7-btn');
                    let mediaStream = null;

                    async function initLayer6Camera() {
                        try {
                            mediaStream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } },
                                audio: false
                            });
                            video.srcObject = mediaStream;
                        } catch (err) {
                            console.log('Camera not available');
                        }
                    }

                    document.getElementById('shutter-action-btn').addEventListener('click', function() {
                        const flashOverlay = document.getElementById('camera-flash-overlay');
                        const context = canvas.getContext('2d');
                        flashOverlay.classList.add('flash');

                        setTimeout(function() {
                            canvas.width = 600;
                            canvas.height = 600;
                            context.translate(canvas.width, 0);
                            context.scale(-1, 1);
                            context.drawImage(video, 0, 0, canvas.width, canvas.height);

                            if (mediaStream) mediaStream.getTracks().forEach(function(track) { track.stop(); });
                            flashOverlay.classList.remove('flash');
                            polaroidResult.classList.add('ejected');
                            retakeBtn.style.display = 'block';
                            nextLayer7Btn.style.display = 'block';
                        }, 150);
                    });

                    retakeBtn.addEventListener('click', function() {
                        polaroidResult.classList.remove('ejected');
                        retakeBtn.style.display = 'none';
                        nextLayer7Btn.style.display = 'none';
                        initLayer6Camera();
                    });

                    // ============================================================
                    // PHOTO UPLOAD - FIXED FOR 35 PHOTOS
                    // ============================================================
                    
                    // Handle photo upload
                    document.getElementById('photo-file-input').addEventListener('change', async function(e) {
                        const files = Array.from(e.target.files);
                        if (files.length === 0) return;

                        // ✅ MAX 35 PHOTOS
                        if (files.length > 35) {
                            alert('⚠️ Maximum 35 photos allowed. Please select up to 35 photos.');
                            this.value = '';
                            return;
                        }

                        // Check file sizes
                        const MAX_SIZE = 3 * 1024 * 1024; // 3MB per photo
                        const oversizedFiles = files.filter(f => f.size > MAX_SIZE);
                        if (oversizedFiles.length > 0) {
                            alert(`⚠️ ${oversizedFiles.length} photo(s) are too large (>3MB).\nPlease compress them and try again.`);
                            this.value = '';
                            return;
                        }

                        const newBase64 = [];
                        let processed = 0;

                        document.getElementById('selected-count-msg').textContent = 
                            `📸 Processing 0/${files.length} photos...`;

                        for (let i = 0; i < files.length; i++) {
                            try {
                                // Compress image before saving
                                const compressedData = await compressImage(files[i], 500, 500, 0.6);
                                newBase64.push(compressedData);
                                processed++;
                                document.getElementById('selected-count-msg').textContent = 
                                    `📸 Processing ${processed}/${files.length} photos...`;
                            } catch (err) {
                                console.warn('Failed to convert:', err);
                            }
                        }

                        if (newBase64.length === 0) {
                            alert('❌ No valid images found. Please try again.');
                            return;
                        }

                        // Merge with existing photos
                        const current = loadPhotos();
                        const allPhotos = current.photos.concat(newBase64);
                        uploadedImageUrls = allPhotos;
                        
                        // SAVE PERMANENTLY
                        const saved = savePhotos(allPhotos);
                        
                        if (saved) {
                            // Update UI - THIS WILL HIDE THE UPLOAD OPTION
                            updateUI();
                            document.getElementById('selected-count-msg').textContent = 
                                `✅ ${uploadedImageUrls.length} photos saved! (${uploadedImageUrls.length} total)`;
                            alert(`✅ ${uploadedImageUrls.length} photos saved permanently!\n\nRefresh karein toh bhi rahengi. Upload option ab nahi dikhega.`);
                            console.log('✅ Saved', uploadedImageUrls.length, 'photos');
                        } else {
                            alert('❌ Error saving photos. Please try again.');
                        }
                    });

                    // ============================================================
                    // SONG UPLOAD
                    // ============================================================
                    document.getElementById('song-file-input').addEventListener('change', async function(e) {
                        const file = e.target.files[0];
                        if (!file) return;

                        try {
                            if (file.size > 10 * 1024 * 1024) {
                                alert('Song file is too large! Please use a file under 10MB.');
                                return;
                            }

                            const base64Data = await fileToBase64(file);
                            uploadedSongData = base64Data;
                            
                            const saved = saveSong(base64Data);
                            
                            if (saved) {
                                const audio = document.getElementById('bg-music');
                                audio.src = base64Data;
                                audio.load();
                                
                                document.getElementById('song-status').textContent = '🎵 "' + file.name + '" loaded successfully!';
                                document.getElementById('song-upload-label').style.display = 'none';
                                document.getElementById('song-file-input').style.display = 'none';
                                
                                alert('✅ Song uploaded successfully!\n\nTap the vinyl to play your song!');
                                console.log('🎵 Song saved:', file.name);
                            } else {
                                alert('❌ Error saving song. Please try again.');
                            }
                        } catch (err) {
                            console.error('Song upload error:', err);
                            alert('Error uploading song. Please try again.');
                        }
                    });

                    // ============================================================
                    // GENERATE VIEWER LINK
                    // ============================================================
                    document.getElementById('generate-link-btn').addEventListener('click', function() {
                        if (uploadedImageUrls.length === 0) {
                            alert('Please upload photos first!');
                            return;
                        }
                        savePhotos(uploadedImageUrls);
                        const viewerUrl = window.location.href.split('?')[0] + '?viewerMode=true';
                        navigator.clipboard.writeText(viewerUrl).then(function() {
                            alert("✅ Viewer Link Copied!\n\nShare this link with your girlfriend ✨\n\nShe will only see the explode option, not upload!");
                        }).catch(function() {
                            prompt("Copy this Viewer Link to send:", viewerUrl);
                        });
                    });

                    // ============================================================
                    // EXPLODE MEMORIES - UPDATED FOR MORE PHOTOS
                    // ============================================================
                    document.getElementById('explode-trigger-btn').addEventListener('click', function() {
                        if (uploadedImageUrls.length === 0) {
                            alert('Please upload photos first!');
                            return;
                        }
                        
                        savePhotos(uploadedImageUrls);
                        
                        document.getElementById('layer7-upload-box').classList.add('fade-out');
                        const explosionContainer = document.getElementById('photo-explosion-layer');
                        const activeImages = uploadedImageUrls;
                        
                        // ✅ More explosions for more photos
                        const totalExplosions = Math.max(50, activeImages.length * 8);
                        
                        // Pre-load images to avoid delays
                        const preloadedImages = [];
                        activeImages.forEach((url) => {
                            const img = new Image();
                            img.src = url;
                            preloadedImages.push(img);
                        });

                        for (let j = 0; j < totalExplosions; j++) {
                            (function(index) {
                                setTimeout(function() {
                                    const card = document.createElement('div');
                                    card.className = 'exploded-photo-card';
                                    const img = document.createElement('img');
                                    img.src = activeImages[index % activeImages.length];
                                    card.appendChild(img);

                                    // Random positions spread across screen
                                    const screenWidth = window.innerWidth;
                                    const screenHeight = window.innerHeight;
                                    
                                    card.style.left = '50%';
                                    card.style.top = '50%';
                                    card.style.setProperty('--tx', ((Math.random() - 0.5) * screenWidth * 1.8) + 'px');
                                    card.style.setProperty('--ty', ((Math.random() - 0.5) * screenHeight * 1.8) + 'px');
                                    card.style.setProperty('--rot', ((Math.random() - 0.5) * 360) + 'deg');
                                    card.style.setProperty('--scl', (0.5 + Math.random() * 1.0).toFixed(2));

                                    explosionContainer.appendChild(card);
                                    requestAnimationFrame(function() { 
                                        card.classList.add('animate-explosion'); 
                                    });
                                }, index * 80);
                            })(j);
                        }

                        setTimeout(function() {
                            const glowScreen = document.getElementById('shiny-glow-screen');
                            glowScreen.classList.add('active');
                            setTimeout(function() {
                                glowScreen.classList.remove('active');
                                document.getElementById('romantic-desc-card').classList.add('visible');
                            }, 1800);
                        }, totalExplosions * 80 + 1200);
                    });

                    // ============================================================
                    // NEXT LAYER 7
                    // ============================================================
                    nextLayer7Btn.addEventListener('click', function() {
                        document.getElementById('polaroid-layer').style.opacity = '0';
                        setTimeout(function() {
                            document.getElementById('polaroid-layer').style.visibility = 'hidden';
                            document.getElementById('photo-explosion-layer').classList.add('active');
                            loadPhotosFromStorage();
                            updateUI();
                        }, 1500);
                    });

                    // ============================================================
                    // THE END
                    // ============================================================
                    document.getElementById('the-end-action-btn').addEventListener('click', function() {
                        document.getElementById('romantic-desc-card').style.opacity = '0';
                        setTimeout(function() {
                            document.getElementById('final-outro-screen').classList.add('active');
                        }, 800);
                    });

                    // ============================================================
                    // INIT - LOAD EVERYTHING
                    // ============================================================
                    const hasSaved = loadPhotosFromStorage();
                    const hasSong = loadSongFromStorage();
                    updateUI();
                    
                    // Viewer mode special handling
                    if (isViewerMode) {
                        const title = document.getElementById('layer7-title-text');
                        const subtitle = document.getElementById('layer7-subtitle-text');
                        const countMsg = document.getElementById('selected-count-msg');
                        const explodeBtn = document.getElementById('explode-trigger-btn');
                        const generateBtn = document.getElementById('generate-link-btn');
                        const uploadLabel = document.getElementById('upload-label-btn');
                        const fileInput = document.getElementById('photo-file-input');
                        const songLabel = document.getElementById('song-upload-label');
                        const songInput = document.getElementById('song-file-input');
                        
                        if (uploadLabel) uploadLabel.style.display = 'none';
                        if (fileInput) fileInput.style.display = 'none';
                        if (generateBtn) generateBtn.style.display = 'none';
                        if (songLabel) songLabel.style.display = 'none';
                        if (songInput) songInput.style.display = 'none';
                        
                        if (!hasSaved) {
                            if (title) title.textContent = '💔 No Memories Found';
                            if (subtitle) subtitle.textContent = 'The creator hasn\'t uploaded any photos yet.';
                            if (countMsg) countMsg.textContent = 'Please ask your partner to upload photos first.';
                            if (countMsg) countMsg.style.display = 'block';
                            if (explodeBtn) explodeBtn.style.display = 'none';
                        } else {
                            if (title) title.textContent = '💖 Your Memories Are Ready!';
                            if (subtitle) subtitle.textContent = 'Tap the button below to watch the magic explode ✨';
                            if (countMsg) countMsg.textContent = uploadedImageUrls.length + ' Photo(s) loaded!';
                            if (countMsg) countMsg.style.display = 'block';
                            if (explodeBtn) {
                                explodeBtn.classList.add('show');
                                explodeBtn.style.display = 'inline-block';
                            }
                        }
                    }

                    console.log('💾 Storage Key:', STORAGE_KEY);
                    console.log('📸 Viewer Mode:', isViewerMode);
                    console.log('📸 Photos Loaded:', uploadedImageUrls.length);
                    console.log('🎵 Song Loaded:', !!uploadedSongData);
                }

                setTimeout(initApp, 300);
            }

            // ============================================================
            // START EVERYTHING
            // ============================================================
            function startEverything() {
                loadThreeJS().then(function() {
                    console.log('✅ Three.js loaded');
                    buildApp();
                }).catch(function() {
                    console.warn('⚠️ Three.js failed, using fallback');
                    buildApp();
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startEverything);
            } else {
                startEverything();
            }

        })();
    </script>
</body>
</html>
